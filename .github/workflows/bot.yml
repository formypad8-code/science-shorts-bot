name: SSC Science Shorts Automator

on:
  schedule:
    - cron: '0 5,13 * * *'
  workflow_dispatch:

jobs:
  generate-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Video Text Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"\/>/<policy domain="path" rights="read|write" pattern="@*"\/>/g' /etc/ImageMagick-6/policy.xml

      - name: Run Automation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Save memory state back to GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add tracker.json
          git commit -m "Progressed to next concept" || echo "No changes"
          git push
      
      - name: Upload Video to Actions Tab
        uses: actions/upload-artifact@v4
        with:
          name: Finished-Videos
          path: "*.mp4"
          
